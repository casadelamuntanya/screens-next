# Commitment page
commitment:
  free_camping:
    title: Free camping
    description: It is allowed to camp freely with a tent outside the Natural Parks and private properties, for a maximum of 2 consecutive nights and a maximum group of 3 tents in the same place.
    keep_clean: The area must be left in perfect condition before leaving.
    authorisation: In other cases, express authorisation must be requested from the corresponding town hall.
  
  shelters:
    title: Shelters
    description: The 22 free shelters in Andorra are open all year round and there is no maximum number of overnight stays. Most shelters have a sleeping area and a room dedicated to the kitchen and dining room.
    check_capacity: The accommodation capacity varies in each shelter; it is advisable to check it beforehand.
  
  fire:
    title: Campfires
    description: There are a number of points to take into account when building a campfire to warm up or cook.
    no_natural_parks: It is forbidden to make campfires in Natural Parks.
    extinguish_fire: Never leave the fire unattended and make sure to extinguish it before leaving.
    surround_rocks: Surround the fire with stones.
    far_trees: Keep the fire away from trees and bushes.
  
  vehicles:
    title: Motorised vehicles
    description: The circulation of motorised or wheeled vehicles within the natural area is regulated by each town hall. The corresponding communal regulations must be consulted before setting off.

  dogs:
    title: Dogs
    description: Dogs must be kept on a leash at all times, even in the wild, and with their muzzles correctly placed if it is a potentially dangerous species.
    excrements: Do not allow dogs to enter meadows and agricultural fields. It is compulsory to always collect their excrements as they can cause serious illnesses to the herds of cows that graze in the meadows.
  
  drones:
    title: Drones
    description: Flying with a drone in a natural environment for recreational purposes is permitted provided that the following conditions are met
    max_weight: Drones weighing less than 1 kg.
    vlos: Keep permanent visual contact with the drone.
    max_height: Maximum flying height of 50 m and maximum radius of 150 m
    no_people: Do not fly over groups of more than 12 people.



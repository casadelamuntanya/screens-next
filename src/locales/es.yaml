# Commitment page
commitment:
  free_camping:
    title: Acampada libre
    description: Se permite acampar libremente con una tienda de campaña fuera de los Parques Naturales y propiedades privadas, por un máximo de 2 noches consecutivas y un grupo máximo de 3 tiendas en el mismo lugar.
    keep_clean: La zona debe dejarse en perfecto estado antes de salir.
    authorisation: En otros casos, se deberá solicitar autorización expresa al ayuntamiento correspondiente.
  
  shelters:
    title: Refugios
    description: Los 22 refugios libres de Andorra están abiertos todo el año y no hay un número máximo de pernoctaciones. La mayoría de refugios disponen de una zona para dormir y una sala dedicada a la cocina y al comedor.
    check_capacity: La capacidad de alojamiento varía en cada refugio; es aconsejable comprobarla previamente.
  
  fire:
    title: Fuego
    description: Hay una serie de puntos a tener en cuenta a la hora de hacer una hoguera para calentarse o cocinar.
    no_natural_parks: Está prohibido hacer hogueras en los Parques Naturales.
    extinguish_fire: No dejar nunca el fuego desatendido y asegurarse de apagarlo antes de salir.
    surround_rocks: Rodear el fuego con piedras.
    far_treess: Mantener el fuego alejado de árboles y arbustos.
  
  vehicles:
    title: Vehículos motorizados
    description: La circulación de vehículos motorizados o con ruedas dentro del espacio natural está regulada por cada ayuntamiento. Se debe consultar la normativa municipal correspondiente antes de emprender la marcha.

  dogs:
    title: Perros
    description: Los perros deben ir siempre con correa, incluso en la naturaleza, y con el bozal correctamente colocado si se trata de una especie potencialmente peligrosa.
    excrements: No permita que los perros entren en los prados y campos agrícolas. Es obligatorio recoger siempre sus excrementos ya que pueden provocar graves enfermedades a los rebaños de vacas que pastan en los prados.
  
  drones:
    title: Drones
    description: Está permitido volar con drones en un entorno natural con fines recreativos siempre que se cumplan las siguientes condiciones
    max_weight: Drones de menos de 1 kg.
    vlos: Mantener un contacto visual permanente con el dron.
    max_height: Altura máxima de vuelo de 50 m y radio máximo de 150 m.
    no_people: No volar sobre grupos de más de 12 personas.



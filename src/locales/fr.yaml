# Commitment
commitment:
  free_camping:
    title: Camping libre
    description: Il est permis de camper librement avec une tente en dehors des parcs naturels et des propriétés privées, pour un maximum de 2 nuits consécutives et un groupe maximum de 3 tentes au même endroit.
    keep_clean: La zone doit être laissée en parfait état avant de partir.
    authorisation: Dans les autres cas, une autorisation expresse doit être demandée à la mairie correspondante.
  
  shelters:
    title: Refuges
    description: Les 22 refuges libres d'Andorre sont ouverts toute l'année et le nombre de nuitées n'est pas limité. La plupart des refuges disposent d'un espace de couchage et d'une pièce dédiée à la cuisine et à la salle à manger.
    check_capacity: La capacité d'hébergement varie dans chaque refuge; il est conseillé de la vérifier au préalable.
  
  fire:
    title: Feux de camp
    description: Il y a un certain nombre de points à prendre en compte pour faire un feu de camp pour se réchauffer ou cuisiner.
    no_natural_parks: Il est interdit de faire des feux de camp dans les parcs naturels.
    extinguish_fire: Ne laissez jamais le feu sans surveillance et veillez à l'éteindre avant de partir.
    surround_rocks: Entourez le feu de pierres.
    far_trees: Maintenez le feu loin des arbres et des buissons.
  
  vehicles:
    title: Véhicules motorisés
    description: La circulation des véhicules motorisés ou à roues dans l'espace naturel est réglementée par chaque mairie. Il convient de consulter le règlement communal correspondant avant de prendre la route.

  dogs:
    title: Chiens
    description: Les chiens doivent être tenus en laisse en permanence, même dans la nature, et avec leur muselière correctement placée s'il s'agit d'une espèce potentiellement dangereuse.
    excrements: Ne pas laisser les chiens pénétrer dans les prairies et les champs agricoles. Il est obligatoire de toujours ramasser leurs excréments car ils peuvent provoquer de graves maladies aux troupeaux de vaches qui paissent dans les prés.
  
  drones:
    title: Drones
    description: Le vol avec un drone dans un environnement naturel à des fins récréatives est autorisé si les conditions suivantes sont respectées
    max_weight: Les drones dont le poids est inférieur à 1 kg.
    vlos: Garder un contact visuel permanent avec le drone.
    max_height: Hauteur maximale de vol de 50 m et rayon maximal de 150 m.
    no_people: Ne pas survoler des groupes de plus de 12 personnes.


